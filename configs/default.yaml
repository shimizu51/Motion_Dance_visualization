video:
  width: 1920
  fps: null
  start: 0.0
  duration: null

detect:
  model: RFDETRSegSmall
  threshold: 0.5
  low_threshold: 0.15
  min_area_ratio: 0.002

track:
  iou_threshold: 0.3
  iou_threshold_low: 0.25
  max_age: 15
  max_age_occluded: 45
  min_hits: 3
  w_iou: 1.0
  w_scale: 0.5
  w_center: 0.3
  center_gate: 0.15
  occlusion_containment: 0.3
  akaze_reset_gap: 3

depth:
  overlap_threshold: 0.3
  w_area: 1.0
  w_foot: 0.5
  ref_area_ema: 0.9
  hysteresis: 0.1

pose:
  model: usyd-community/vitpose-base-simple
  keypoint_score_threshold: 0.3
  mask_suppress_alpha: 0.8
  oneeuro:
    min_cutoff: 1.0
    beta: 0.01

akaze:
  # trail_mode は現在どのコードからも読まれていない（akaze_lk は未実装）
  trail_mode: akaze
  ratio_test: 0.75
  max_displacement: 60.0
  max_points_per_person: 400

# 背景特徴点によるカメラ大域運動の推定。計測（特徴量）専用で、描画には影響しない。
camera:
  enabled: true
  downscale: 2
  ratio_test: 0.75
  max_points: 1000
  ransac_threshold: 3.0
  mask_dilate: 15

# 単眼 2D→3D リフティング（MotionBERT）。`pose-viz lift3d` でのみ使う。
# 2D 関節角度が面外回転で歪む問題を潰す目的。出力は「関節角度」のまま説明可能。
lift3d:
  clip_len: 243          # モデルの上限
  stride: null           # 窓の移動量（既定は clip_len の半分）
  flip_augment: true     # 左右反転の平均。精度が上がる代わりに 2 倍の時間
  device: null           # 既定は mps があれば mps

# 解釈可能な動作特徴量。分析側の設定なので extract_hash には含まれない（変えても再抽出は不要）。
feature:
  source: raw            # raw = 平滑化前（計測用） / smoothed = One-Euro 後（比較用）
  angle_source: auto     # auto = 3D があれば 3D / 2d / 3d（検証時に固定する）
  min_score: 0.3
  max_gap_sec: 0.2
  scale_window_sec: 2.0
  deriv_window_sec: 0.25
  deriv_polyorder: 3
  foreshorten_threshold: 0.6
  flip_min_sec: 0.2
  sparc_window_sec: 2.0
  symmetry_window_sec: 2.0
  rhythm_min_period_sec: 0.25
  rhythm_max_period_sec: 4.0
  load_percentile: 95.0
  load_weights: [1.0, 1.0, 1.0, 1.0]   # 角速度・角加速度・ROM逸脱・制動（まず等重み）

residual:
  lifetime_sec: 0.8
  gamma: 1.6
  lifetime_boost_k: 1.0
  joint_trail_len: 20
  norm_scale: 8.0
  max_trail_len: 40

render:
  ghost_alpha: 0.15
  ghost_blur: 9
  ghost_desaturate: 0.8
  particle_glow: 11
  skeleton_bloom: [5, 25]
  bone_thickness: 3
  vignette: 0.2
  grain: 0.02
  depth_body_occlude: false
  # 特徴量による骨格の変調。off = 特徴量を計算せず従来と完全に同一の出力。
  # load = 関節負荷の代理指標 / speed = 関節速度
  feature_modulation: "off"
  feature_thickness_gain: 4.0
  feature_highlight: 1.0
  # AKAZE 残差の「向き」で粒子の先頭を伸ばす倍率。0 で無効
  residual_streak_gain: 0.0
